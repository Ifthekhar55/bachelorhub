# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Increased memory for better performance with WebRTC and large projects
org.gradle.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Enable experimental features for better performance
android.experimental.enableNewResourceShrinking=false

# Enable incremental dex for faster builds
android.enableIncrementalDex=true

# Enable incremental annotation processing
android.enableIncrementalAnnotationProcessing=true

# Enable incremental Java compilation
android.enableIncrementalJavaCompilation=true

# Enable incremental Kotlin compilation (if using Kotlin)
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true

# Enable Java 8 features
android.enableD8.desugaring=true

# Enable R8 full mode for better optimization (release builds)
android.enableR8.fullMode=false

# Enable pre-dexing for faster builds
android.enablePreDexing=true

# Configure test runner
android.testInstrumentationRunnerArguments.useTestStorageService=false

# Enable feature splitting for smaller APKs (if needed)
android.disableResourceValidation=false

# Enable vector drawables support
android.enableVectorDrawables=true

# Enable build cache for faster builds
org.gradle.caching=true

# Enable Kotlin build cache (if using Kotlin)
kotlin.build.cache.enabled=true

# Increase memory for Gradle daemon
org.gradle.workers.max=4